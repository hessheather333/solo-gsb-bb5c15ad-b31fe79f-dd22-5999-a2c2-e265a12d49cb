services:
  mic-coordinator:
    build: .
    image: mic-frequency-coordinator:latest
    container_name: mic-frequency-coordinator
    ports:
      - "3000:3000"
    volumes:
      # SQLite 数据库持久化到命名卷；不挂载源码，镜像内为生产构建
      - coordinator-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  coordinator-data:
